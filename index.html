<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Yousuf's AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF5EC;
    --paper-deep: #F1E6D2;
    --ink: #211E1B;
    --ink-soft: #7A7266;
    --coral: #E2572B;
    --coral-deep: #B8431C;
    --sage: #566246;
    --line: #E2D2AF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(ellipse at top left, rgba(226,87,43,0.08), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(86,98,70,0.08), transparent 55%),
      var(--paper-deep);
    background-image:
      radial-gradient(ellipse at top left, rgba(226,87,43,0.08), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(86,98,70,0.08), transparent 55%),
      radial-gradient(circle at 1px 1px, rgba(33,30,27,0.07) 1px, transparent 0);
    background-size: auto, auto, 20px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: var(--ink);
  }

  .chat-container {
    width: 100%;
    max-width: 460px;
    background: var(--paper);
    border-radius: 20px;
    box-shadow: 0 30px 60px rgba(33,30,27,0.22), 0 1px 0 rgba(255,255,255,0.6) inset;
    display: flex;
    flex-direction: column;
    height: min(690px, 92vh);
    overflow: hidden;
    border: 1px solid var(--line);
  }

  /* --- Header --- */
  .chat-header {
    position: relative;
    background: linear-gradient(180deg, var(--paper) 0%, #F6EEDF 100%);
    border-bottom: 1px solid var(--line);
    padding: 20px 22px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .chat-header::after {
    content: "";
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 3px;
    background: repeating-linear-gradient(90deg, var(--coral), var(--coral) 6px, transparent 6px, transparent 12px);
    opacity: 0.5;
  }

  .mark {
    flex-shrink: 0;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(33,30,27,0.25);
  }

  .mark svg { width: 26px; height: 26px; }

  .mark-path {
    stroke: var(--paper);
    stroke-width: 7;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 220;
    stroke-dashoffset: 220;
    animation: draw 1s ease forwards 0.25s;
  }

  @keyframes draw { to { stroke-dashoffset: 0; } }

  .header-text .title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 23px;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }

  .header-text .subtitle {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 3px;
    font-style: italic;
    font-family: 'Fraunces', serif;
  }

  .status-dot {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--sage);
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .status-dot span.dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--sage);
    display: inline-block;
    box-shadow: 0 0 0 0 rgba(86,98,70,0.5);
    animation: ping 2s ease-out infinite;
  }

  @keyframes ping {
    0% { box-shadow: 0 0 0 0 rgba(86,98,70,0.45); }
    70% { box-shadow: 0 0 0 6px rgba(86,98,70,0); }
    100% { box-shadow: 0 0 0 0 rgba(86,98,70,0); }
  }

  /* --- Messages --- */
  .chat-messages {
    flex: 1;
    padding: 22px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--ink-soft);
    padding: 20px;
  }

  .empty-state .big-mark {
    width: 64px; height: 64px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: var(--ink);
    display: flex; align-items: center; justify-content: center;
    opacity: 0.9;
  }

  .empty-state .big-mark svg { width: 34px; height: 34px; }
  .empty-state .big-mark path {
    stroke: var(--paper); stroke-width: 7; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
  }

  .empty-state p {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
  }

  .message {
    max-width: 80%;
    padding: 12px 16px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
    animation: rise 0.28s cubic-bezier(.2,.8,.2,1);
  }

  @keyframes rise {
    from { transform: translateY(8px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .user {
    align-self: flex-end;
    background: linear-gradient(155deg, var(--coral), var(--coral-deep));
    color: var(--paper);
    border-radius: 16px 16px 3px 16px;
    box-shadow: 0 4px 10px rgba(226,87,43,0.28);
  }

  .bot {
    align-self: flex-start;
    background: var(--paper-deep);
    color: var(--ink);
    border-radius: 16px 16px 16px 3px;
    border: 1px solid var(--line);
  }

  .typing-dots {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 4px 2px;
  }

  .typing-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ink-soft);
    animation: bounce 1.1s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* --- Input --- */
  .chat-input {
    display: flex;
    padding: 14px 16px;
    gap: 8px;
    background: var(--paper);
    border-top: 1px solid var(--line);
  }

  .chat-input input {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    outline: none;
    font-size: 16px;
    font-family: 'Inter', sans-serif;
    background: var(--paper-deep);
    color: var(--ink);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .chat-input input::placeholder { color: var(--ink-soft); }

  .chat-input input:focus {
    border-color: var(--coral);
    background: var(--paper);
    box-shadow: 0 0 0 3px rgba(226,87,43,0.12);
  }

  .chat-input button {
    background: var(--ink);
    color: var(--paper);
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }

  .chat-input button svg { width: 18px; height: 18px; }

  .chat-input button:hover:not(:disabled) { background: var(--coral-deep); }
  .chat-input button:active:not(:disabled) { transform: scale(0.92); }
  .chat-input button:disabled { opacity: 0.35; cursor: not-allowed; }

  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

  @media (max-width: 480px) {
    body { padding: 0; }
    .chat-container {
      max-width: 100%;
      height: 100vh;
      border-radius: 0;
      border: none;
    }
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="mark">
      <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
        <path class="mark-path" d="M 8 8 L 22 24 L 36 8 M 22 24 L 22 38" />
      </svg>
    </div>
    <div class="header-text">
      <div class="title">Yousuf's AI</div>
      <div class="subtitle">a little help, always on hand</div>
    </div>
    <div class="status-dot"><span class="dot"></span>online</div>
  </div>
  <div class="chat-messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="big-mark">
        <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
          <path d="M 8 8 L 22 24 L 36 8 M 22 24 L 22 38" />
        </svg>
      </div>
      <p>What's on your mind today?</p>
    </div>
  </div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Ask me anything..." />
    <button id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const BACKEND_URL = "https://yousuf-ai-backend.vercel.app/api/chat";

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const emptyState = document.getElementById("emptyState");

  function addMessage(text, sender) {
    if (emptyState) emptyState.remove();
    const div = document.createElement("div");
    div.className = "message " + sender;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addTyping() {
    if (emptyState) emptyState.remove();
    const div = document.createElement("div");
    div.className = "message bot";
    div.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;

    const typingBubble = addTyping();

    try {
      const res = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      typingBubble.textContent = data.reply || "Sorry, something went wrong.";
    } catch (err) {
      typingBubble.textContent = "Could not reach the chatbot backend. Is it running?";
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
