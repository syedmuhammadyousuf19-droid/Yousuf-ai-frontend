<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Yousuf's AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root {
    --paper: #15171E;
    --paper-deep: #1C1F29;
    --ink: #E8E9EF;
    --ink-soft: #8C90A3;
    --coral: #4C8DFF;
    --coral-deep: #7C5CFF;
    --sage: #34D399;
    --line: #2B2E3B;
    --on-accent: #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--paper-deep);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
  }

  /* --- Animated background --- */
  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.18;
    pointer-events: none;
    z-index: 0;
  }
  .bg-blob.b1 { width: 320px; height: 320px; background: var(--coral); top: -80px; left: -100px; animation: drift1 16s ease-in-out infinite; }
  .bg-blob.b2 { width: 260px; height: 260px; background: var(--coral-deep); bottom: -60px; right: -80px; animation: drift2 20s ease-in-out infinite; }
  .bg-blob.b3 { width: 200px; height: 200px; background: #C15CFF; top: 40%; right: 10%; animation: drift3 14s ease-in-out infinite; }

  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px,60px) scale(1.15); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-30px,-40px) scale(1.1); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-25px,30px) scale(0.9); } }

  .grain-overlay {
    position: fixed; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
    background-size: 20px 20px;
    pointer-events: none;
    z-index: 0;
  }

  /* Full Page App Layout */
  .chat-container {
    position: relative;
    z-index: 1;
    width: 100vw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: transparent;
  }

  .content-column {
    width: 100%;
    max-width: 768px;
    margin: 0 auto;
    padding-left: 16px;
    padding-right: 16px;
  }

  /* --- Header --- */
  .chat-header-bar {
    width: 100%;
    background: linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
    position: relative;
  }

  .chat-header {
    padding: 16px 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .chat-header-bar::after {
    content: "";
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 2px;
    background: repeating-linear-gradient(90deg, var(--coral), var(--coral) 6px, transparent 6px, transparent 12px);
    opacity: 0.4;
  }

  .icon-btn {
    background: none;
    border: none;
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft);
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.06); color: var(--ink); }
  .icon-btn svg { width: 20px; height: 20px; }

  .mark {
    flex-shrink: 0;
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--coral), var(--coral-deep));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(76,141,255,0.35);
  }
  .mark svg { width: 20px; height: 20px; }

  .mark-path {
    stroke: var(--on-accent); stroke-width: 7; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 220; stroke-dashoffset: 220;
    animation: draw 1s ease forwards 0.25s;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .header-text { flex: 1; min-width: 0; }
  .header-text .title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 18px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-text .subtitle {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 2px;
    font-style: italic;
    font-family: 'Fraunces', serif;
  }

  /* --- History panel --- */
  .history-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
  }
  .history-overlay.open { display: block; }

  .history-panel {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 85%;
    max-width: 320px;
    background: var(--paper);
    border-right: 1px solid var(--line);
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
  }
  .history-overlay.open .history-panel { transform: translateX(0); }

  .history-header {
    padding: 16px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .history-header .htitle {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 16px;
    flex: 1;
  }

  .new-chat-btn {
    background: var(--coral);
    color: #fff;
    border: none;
    padding: 10px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    margin: 12px 16px;
  }
  .new-chat-btn:hover { background: var(--coral-deep); }

  .history-list { flex: 1; overflow-y: auto; padding: 0 10px 16px; }

  .history-item {
    padding: 11px 12px;
    border-radius: 10px;
    margin-bottom: 4px;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    transition: background 0.15s;
  }
  .history-item:hover { background: var(--paper-deep); }
  .history-item.active { background: rgba(76,141,255,0.14); }

  .history-item .h-text { flex: 1; min-width: 0; }
  .history-item .h-title {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-item .h-time { font-size: 10.5px; color: var(--ink-soft); margin-top: 2px; }

  .history-item .h-delete {
    background: none; border: none;
    color: var(--ink-soft);
    font-size: 13px;
    cursor: pointer;
    padding: 2px 4px;
    flex-shrink: 0;
  }
  .history-item .h-delete:hover { color: var(--coral); }

  .history-empty {
    padding: 30px 20px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    font-style: italic;
    font-family: 'Fraunces', serif;
  }

  /* --- Messages Scroll Area --- */
  .chat-messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 24px 0;
  }

  .messages-inner {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .empty-state {
    margin: 10vh auto;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty-state .big-mark {
    width: 64px; height: 64px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--coral), var(--coral-deep));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(76,141,255,0.3);
  }
  .empty-state .big-mark svg { width: 34px; height: 34px; }
  .empty-state .big-mark path { stroke: var(--on-accent); stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .empty-state p { font-family: 'Fraunces', serif; font-style: italic; font-size: 16px; }

  /* Message Bubbles - Fixed Overflow Bug */
  .message {
    max-width: 82%;
    padding: 14px 18px;
    line-height: 1.6;
    font-size: 15px;
    animation: rise 0.28s cubic-bezier(.2,.8,.2,1);
    word-break: break-word;
    overflow-wrap: break-word;
    overflow: hidden; /* Fixes internal scrollbars */
  }

  .message img.msg-photo {
    max-width: 100%;
    max-height: 320px;
    border-radius: 10px;
    display: block;
    margin-bottom: 10px;
    object-fit: contain;
  }

  @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .user {
    align-self: flex-end;
    background: linear-gradient(155deg, var(--coral), var(--coral-deep));
    color: var(--on-accent);
    border-radius: 18px 18px 4px 18px;
    box-shadow: 0 4px 14px rgba(76,141,255,0.25);
  }
  
  .bot {
    align-self: flex-start;
    background: var(--paper);
    color: var(--ink);
    border-radius: 18px 18px 18px 4px;
    border: 1px solid var(--line);
  }

  .math-block {
    overflow-x: auto;
    margin: 8px 0;
    padding: 4px 0;
  }

  .typing-dots { display: flex; gap: 5px; align-items: center; padding: 6px 2px; }
  .typing-dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-soft); animation: bounce 1.1s ease-in-out infinite; }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-5px); opacity: 1; } }

  /* --- Preview Bar & Input Bar --- */
  .chat-input-bar {
    width: 100%;
    background: var(--paper);
    border-top: 1px solid var(--line);
    flex-shrink: 0;
    padding: 12px 0 16px;
  }

  .image-preview-bar {
    display: none;
    margin-bottom: 10px;
  }
  .image-preview-bar.show { display: block; }

  .preview-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px 10px;
  }
  .preview-chip img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; }
  .preview-chip button {
    background: none; border: none;
    color: var(--ink-soft);
    font-size: 14px;
    cursor: pointer;
    padding: 4px;
  }
  .preview-chip button:hover { color: var(--coral); }

  .chat-input {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .chat-input input[type="text"] {
    flex: 1;
    padding: 14px 20px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    outline: none;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    background: var(--paper-deep);
    color: var(--ink);
    transition: border-color 0.2s, box-shadow 0.2s;
    min-width: 0;
  }
  .chat-input input[type="text"]::placeholder { color: var(--ink-soft); }
  .chat-input input[type="text"]:focus {
    border-color: var(--coral);
    background: var(--paper);
    box-shadow: 0 0 0 3px rgba(76,141,255,0.18);
  }

  .attach-btn, .send-btn {
    background: linear-gradient(135deg, var(--coral), var(--coral-deep));
    color: var(--on-accent);
    border: none;
    width: 48px; height: 48px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: filter 0.15s, transform 0.1s;
  }
  .attach-btn { background: var(--paper-deep); color: var(--ink); border: 1.5px solid var(--line); }
  .attach-btn:hover { border-color: var(--coral); color: var(--coral); }
  .send-btn:hover:not(:disabled) { filter: brightness(1.1); }
  .send-btn:active:not(:disabled) { transform: scale(0.94); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .attach-btn svg, .send-btn svg { width: 20px; height: 20px; }

  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
</style>
</head>
<body>

<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="bg-blob b3"></div>
<div class="grain-overlay"></div>

<div class="chat-container">
  
  <div class="chat-header-bar">
    <div class="content-column">
      <div class="chat-header">
        <button class="icon-btn" id="historyBtn" aria-label="History" title="History">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 8v4l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="mark">
          <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
            <path class="mark-path" d="M 8 8 L 22 24 L 36 8 M 22 24 L 22 38" />
          </svg>
        </div>
        <div class="header-text">
          <div class="title">Yousuf's AI</div>
          <div class="subtitle">a little help, always on hand</div>
        </div>
        <button class="icon-btn" id="newChatHeaderBtn" aria-label="New chat" title="New chat">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="history-overlay" id="historyOverlay">
    <div class="history-panel">
      <div class="history-header">
        <div class="htitle">Recents</div>
        <button class="icon-btn" id="closeHistoryBtn" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <button class="new-chat-btn" id="newChatPanelBtn">+ New chat</button>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <div class="chat-messages" id="messages">
    <div class="content-column">
      <div class="messages-inner" id="messagesInner">
        <div class="empty-state" id="emptyState">
          <div class="big-mark">
            <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
              <path d="M 8 8 L 22 24 L 36 8 M 22 24 L 22 38" />
            </svg>
          </div>
          <p>What's on your mind today?</p>
        </div>
      </div>
    </div>
  </div>

  <div class="chat-input-bar">
    <div class="content-column">
      <div class="image-preview-bar" id="imagePreviewBar">
        <div class="preview-chip">
          <img id="previewImg" src="" alt="Selected photo" />
          <button id="removeImageBtn" aria-label="Remove photo">✕</button>
        </div>
      </div>

      <div class="chat-input">
        <input type="file" id="imageInput" accept="image/*" style="display:none;" />
        <button class="attach-btn" id="attachBtn" aria-label="Attach photo" title="Attach photo">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12.5v5a3.5 3.5 0 0 1-7 0v-8a2.5 2.5 0 0 1 5 0v7a1.5 1.5 0 0 1-3 0v-6" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <input type="text" id="userInput" placeholder="Ask me anything..." />
        <button class="send-btn" id="sendBtn" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

</div>

<script>
  const BACKEND_URL = "https://yousuf-ai-backend.vercel.app/api/chat";
  const STORAGE_KEY = "yousufsAiHistory";

  const messagesContainer = document.getElementById("messages");
  const messagesInner = document.getElementById("messagesInner");
  const inputEl = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const attachBtn = document.getElementById("attachBtn");
  const imageInput = document.getElementById("imageInput");
  const imagePreviewBar = document.getElementById("imagePreviewBar");
  const previewImg = document.getElementById("previewImg");
  const removeImageBtn = document.getElementById("removeImageBtn");
  const historyBtn = document.getElementById("historyBtn");
  const closeHistoryBtn = document.getElementById("closeHistoryBtn");
  const historyOverlay = document.getElementById("historyOverlay");
  const historyList = document.getElementById("historyList");
  const newChatHeaderBtn = document.getElementById("newChatHeaderBtn");
  const newChatPanelBtn = document.getElementById("newChatPanelBtn");

  let pendingImage = null;
  let currentConversation = { id: null, title: null, messages: [] };

  function scrollToBottom() {
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  // ---------- History storage ----------
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveHistory(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
    catch (e) { /* storage full */ }
  }

  function persistCurrentConversation() {
    if (currentConversation.messages.length === 0) return;
    if (!currentConversation.id) currentConversation.id = 'c_' + Date.now();
    if (!currentConversation.title) {
      const firstUserMsg = currentConversation.messages.find(m => m.sender === 'user');
      currentConversation.title = firstUserMsg
        ? (firstUserMsg.text || 'Photo question').slice(0, 40)
        : 'New chat';
    }
    currentConversation.updatedAt = Date.now();

    let list = loadHistory();
    const idx = list.findIndex(c => c.id === currentConversation.id);
    if (idx >= 0) list[idx] = currentConversation;
    else list.unshift(currentConversation);
    list.sort((a, b) => b.updatedAt - a.updatedAt);
    saveHistory(list);
  }

  function timeAgo(ts) {
    const diff = Date.now() - ts;
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    const days = Math.floor(hrs / 24);
    return days + "d ago";
  }

  function renderHistoryList() {
    const list = loadHistory();
    historyList.innerHTML = '';
    if (list.length === 0) {
      historyList.innerHTML = '<div class="history-empty">No conversations yet — start chatting!</div>';
      return;
    }
    list.forEach(conv => {
      const item = document.createElement('div');
      item.className = 'history-item' + (conv.id === currentConversation.id ? ' active' : '');
      item.innerHTML = `
        <div class="h-text">
          <div class="h-title">${escapeHtml(conv.title || 'New chat')}</div>
          <div class="h-time">${timeAgo(conv.updatedAt)}</div>
        </div>
        <button class="h-delete" title="Delete">✕</button>
      `;
      item.querySelector('.h-text').addEventListener('click', () => {
        loadConversation(conv);
        closeHistory();
      });
      item.querySelector('.h-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        const updated = loadHistory().filter(c => c.id !== conv.id);
        saveHistory(updated);
        if (conv.id === currentConversation.id) startNewChat();
        renderHistoryList();
      });
      historyList.appendChild(item);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function openHistory() { renderHistoryList(); historyOverlay.classList.add('open'); }
  function closeHistory() { historyOverlay.classList.remove('open'); }

  historyBtn.addEventListener('click', openHistory);
  closeHistoryBtn.addEventListener('click', closeHistory);
  historyOverlay.addEventListener('click', (e) => { if (e.target === historyOverlay) closeHistory(); });

  function startNewChat() {
    currentConversation = { id: null, title: null, messages: [] };
    messagesInner.innerHTML = `
      <div class="empty-state" id="emptyState">
        <div class="big-mark">
          <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
            <path d="M 8 8 L 22 24 L 36 8 M 22 24 L 22 38" />
          </svg>
        </div>
        <p>What's on your mind today?</p>
      </div>`;
    clearPendingImage();
  }

  newChatHeaderBtn.addEventListener('click', startNewChat);
  newChatPanelBtn.addEventListener('click', () => { startNewChat(); closeHistory(); });

  function loadConversation(conv) {
    currentConversation = JSON.parse(JSON.stringify(conv));
    messagesInner.innerHTML = '';
    currentConversation.messages.forEach(m => {
      renderMessageToDOM(m.sender, m.text, m.image);
    });
    scrollToBottom();
  }

  // ---------- Rendering ----------
  function renderMessageToDOM(sender, text, imageDataUrl) {
    const empty = document.getElementById("emptyState");
    if (empty) empty.remove();
    
    const div = document.createElement("div");
    div.className = "message " + sender;

    if (imageDataUrl) {
      const img = document.createElement('img');
      img.src = imageDataUrl;
      img.className = 'msg-photo';
      div.appendChild(img);
    }

    if (sender === 'bot') {
      const textWrap = document.createElement('div');
      renderMathContent(textWrap, text || '');
      div.appendChild(textWrap);
    } else if (text) {
      const span = document.createElement('span');
      span.style.whiteSpace = 'pre-wrap';
      span.textContent = text;
      div.appendChild(span);
    }

    messagesInner.appendChild(div);
    scrollToBottom();
    return div;
  }

  function renderMathContent(container, raw) {
    container.innerHTML = '';
    const parts = raw.split(/(\$\$[\s\S]+?\$\$|\$[^\$\n]+?\$)/g);
    parts.forEach(part => {
      if (!part) return;
      if (part.startsWith('$$') && part.endsWith('$$')) {
        const div = document.createElement('div');
        div.className = 'math-block';
        try { katex.render(part.slice(2, -2), div, { throwOnError: false, displayMode: true }); }
        catch (e) { div.textContent = part; }
        container.appendChild(div);
      } else if (part.startsWith('$') && part.endsWith('$')) {
        const span = document.createElement('span');
        try { katex.render(part.slice(1, -1), span, { throwOnError: false, displayMode: false }); }
        catch (e) { span.textContent = part; }
        container.appendChild(span);
      } else {
        const span = document.createElement('span');
        span.style.whiteSpace = 'pre-wrap';
        span.textContent = part;
        container.appendChild(span);
      }
    });
  }

  function addTyping() {
    const empty = document.getElementById("emptyState");
    if (empty) empty.remove();
    
    const div = document.createElement("div");
    div.className = "message bot";
    div.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    messagesInner.appendChild(div);
    scrollToBottom();
    return div;
  }

  // ---------- Image handling ----------
  attachBtn.addEventListener('click', () => imageInput.click());

  function resizeImage(file, maxDim = 900, quality = 0.75) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxDim) { height = height * (maxDim / width); width = maxDim; }
          else if (height > maxDim) { width = width * (maxDim / height); height = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  imageInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      pendingImage = await resizeImage(file);
      previewImg.src = pendingImage;
      imagePreviewBar.classList.add('show');
    } catch (err) {
      alert('Could not load that image, try another one.');
    }
    e.target.value = '';
  });

  function clearPendingImage() {
    pendingImage = null;
    previewImg.src = '';
    imagePreviewBar.classList.remove('show');
  }
  removeImageBtn.addEventListener('click', clearPendingImage);

  // ---------- Sending ----------
  async function sendMessage() {
    const text = inputEl.value.trim();
    const imageToSend = pendingImage;
    if (!text && !imageToSend) return;

    renderMessageToDOM('user', text, imageToSend);
    currentConversation.messages.push({ sender: 'user', text, image: imageToSend });
    persistCurrentConversation();

    inputEl.value = "";
    clearPendingImage();
    sendBtn.disabled = true;

    const typingBubble = addTyping();

    try {
      const body = { message: text };
      if (imageToSend) body.image = imageToSend;

      const res = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      const reply = data.reply || "Sorry, something went wrong.";
      const textWrap = document.createElement('div');
      renderMathContent(textWrap, reply);
      typingBubble.innerHTML = '';
      typingBubble.appendChild(textWrap);
      scrollToBottom();

      currentConversation.messages.push({ sender: 'bot', text: reply });
      persistCurrentConversation();
    } catch (err) {
      typingBubble.textContent = "Could not reach the chatbot backend. Is it running?";
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
  inputEl.addEventListener("focus", () => {
    setTimeout(scrollToBottom, 300);
  });
</script>

</body>
